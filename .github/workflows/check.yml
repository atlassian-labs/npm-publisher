name: Check publisher
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - run: npm run check
      - run: npm test
      - name: Audit installed dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/
