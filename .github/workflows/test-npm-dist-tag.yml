name: Test npm dist-tag with OIDC
run-name: Tag ${{ inputs.package_name }}@${{ inputs.version }} as ${{ inputs.dist_tag }}

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: npm package name, including scope if applicable
        required: true
        default: tungnguyen-atl-tung-test3
        type: string
      version:
        description: Existing package version
        required: true
        default: '0.0.0'
        type: string
      dist_tag:
        description: Dist-tag to add or update
        required: true
        default: oidc-dist-tag-test
        type: string

permissions: {}

concurrency:
  group: npmjs::${{ inputs.package_name }}
  queue: max
  cancel-in-progress: false

jobs:
  dist-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npmjs-prod
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      PACKAGE_VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Add dist-tag using OIDC and show tags
        run: |
          npm dist-tag add --registry=https://registry.npmjs.org/ -- "$PACKAGE_NAME@$PACKAGE_VERSION" "$DIST_TAG"
          npm dist-tag ls --registry=https://registry.npmjs.org/ -- "$PACKAGE_NAME"
